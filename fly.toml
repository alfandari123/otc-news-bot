# fly.toml app configuration file generated for cosmos on 2026-08-11T18:51:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cosmos'
primary_region = 'lhr'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 8080
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
